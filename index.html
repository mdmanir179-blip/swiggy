<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Ensure window.fetch is writable if defined as getter-only by browser/extension -->
    <script>
      (function() {
        try {
          var current = window;
          var desc = null;
          while (current && !desc) {
            desc = Object.getOwnPropertyDescriptor(current, 'fetch');
            current = Object.getPrototypeOf(current);
          }
          if (desc && ((desc.get && !desc.set) || desc.writable === false)) {
            var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
            var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!ownDesc || ownDesc.configurable) {
              Object.defineProperty(window, 'fetch', {
                value: currentFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {}
        window.addEventListener('error', function(event) {
          var src = event && (event.filename || (event.error && event.error.stack) || '');
          if (typeof src === 'string' && src.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var stack = reason && typeof reason.stack === 'string' ? reason.stack : '';
          var name = reason && typeof reason.name === 'string' ? reason.name : '';
          if (stack.indexOf('chrome-extension://') !== -1 || name === 'AbortError') {
            event.preventDefault();
          }
        }, true);
      })();
    </script>

    <!-- Capture PWA install event early so it is never missed -->
    <script>
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
    </script>

    <!-- PWA and Browser Color Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Instamart" />

    <!-- Web App Manifest for Desktop & Mobile Installation -->

    <!-- Favicon & Icons -->

    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Instamart Payment Tracker</title>
    <meta name="description" content="Comprehensive financial analytics, invoice reconciliation, and payment tracking for Instamart vendors with accurate INR accounting, automated Excel/CSV processing, and export." />
    <meta property="og:title" content="Instamart Payment Tracker" />
    <meta property="og:description" content="Comprehensive financial analytics, invoice reconciliation, and payment tracking for Instamart vendors with accurate INR accounting, automated Excel/CSV processing, and export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
