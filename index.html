<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Capture PWA install event early so it is never missed -->
    <script>
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
    </script>

    <!-- PWA and Browser Color Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Instamart" />

    <!-- Web App Manifest for Desktop & Mobile Installation -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Instamart Payment Tracker</title>
    <meta name="description" content="Comprehensive financial analytics, invoice reconciliation, and payment tracking for Instamart vendors with accurate INR accounting, automated Excel/CSV processing, and export." />
    <meta property="og:title" content="Instamart Payment Tracker" />
    <meta property="og:description" content="Comprehensive financial analytics, invoice reconciliation, and payment tracking for Instamart vendors with accurate INR accounting, automated Excel/CSV processing, and export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased font-sans selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
